name: Build and deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install openpyxl pillow

      # gen_cv_lists.py and build.py fetch the published Google Sheet directly
      # (see sheet_data.py), so there is no separate download step. To point at a
      # different sheet, set the repo variable SHEET_EXPORT_URL.
      - name: Update CV lists from spreadsheet
        env:
          SHEET_EXPORT_URL: ${{ vars.SHEET_EXPORT_URL }}
        run: python gen_cv_lists.py

      - name: Build site
        env:
          SHEET_EXPORT_URL: ${{ vars.SHEET_EXPORT_URL }}
        run: python build.py

      - name: Compile CV (LaTeX)
        # Pinned to an exact release (TeX Live 2025) so the toolchain can't drift
        # and silently re-break biber/bibtex. Bump deliberately, not automatically.
        uses: xu-cheng/latex-action@3.3.0
        with:
          working_directory: cv
          root_file: Colonius.tex
          latexmk_use_xelatex: false
          args: "-pdf -interaction=nonstopmode -file-line-error"

      - name: Copy CV to docs
        run: cp cv/Colonius.pdf docs/cv.pdf

      - name: Check out CSTAT documentation source
        uses: actions/checkout@v5.0.1
        with:
          repository: ComputationalFlowPhysics/CSTAT
          ref: main
          path: _cstat
          persist-credentials: false

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends doxygen

      - name: Build and check CSTAT documentation
        working-directory: _cstat
        run: python3 scripts/documentation/build.py

      - name: Include CSTAT in the published website
        run: |
          test -s _cstat/build-documentation/html/index.html
          test -s _cstat/build-documentation/html/annotated.html
          mkdir docs/cstat
          cp -a _cstat/build-documentation/html/. docs/cstat/
          git -C _cstat rev-parse HEAD > docs/cstat/source-revision.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
